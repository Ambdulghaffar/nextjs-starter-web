<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Rifline – Présentation authentification (mobile)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --blue: #2f7bff;
        --ink: #1a2236;
        --moon: #4a5bff;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #04060b;
        font-family:
          "Outfit",
          "Segoe UI",
          system-ui,
          -apple-system,
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
      }
      body.rec {
        cursor: none;
      }
      #fit {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 1080px;
        height: 1920px;
        transform-origin: 0 0;
      }
      #stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: radial-gradient(
          1500px 1100px at 12% 6%,
          #2f58e6 0%,
          #1b2c74 46%,
          #0a1130 100%
        );
      }
      #stage::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          1000px 800px at 95% 100%,
          rgba(74, 91, 255, 0.35),
          transparent 70%
        );
        pointer-events: none;
      }

      /* diapos */
      .slide {
        position: absolute;
        inset: 0;
        opacity: 0;
        transform: translateX(90px) scale(0.95);
        z-index: 2;
      }
      .slide.vis {
        opacity: 1;
        transform: none;
        transition:
          opacity 0.9s cubic-bezier(0.65, 0, 0.35, 1),
          transform 1.1s cubic-bezier(0.65, 0, 0.35, 1);
      }
      .slide.out {
        opacity: 0;
        transform: translateX(-90px) scale(0.95);
        transition:
          opacity 0.9s cubic-bezier(0.65, 0, 0.35, 1),
          transform 1.1s cubic-bezier(0.65, 0, 0.35, 1);
      }

      /* intro */
      .intro {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #fff;
        text-align: center;
        padding: 0 90px;
      }
      .intro .w {
        font-size: 190px;
        font-weight: 600;
        letter-spacing: -4px;
        line-height: 1;
      }
      .intro .tg {
        font-size: 56px;
        font-weight: 400;
        color: #d5ddff;
        margin-top: 30px;
        line-height: 1.25;
      }
      .intro .sb {
        margin-top: 70px;
        font-size: 34px;
        font-weight: 500;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        padding: 16px 38px;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-radius: 999px;
        color: #fff;
      }
      .intro .w,
      .intro .tg,
      .intro .sb {
        opacity: 0;
        transform: translateY(16px);
        transition:
          opacity 0.7s ease,
          transform 0.7s ease;
      }
      .intro .on {
        opacity: 1;
        transform: none;
      }

      /* téléphone */
      .phone {
        position: absolute;
        left: 208px;
        top: 200px;
        width: 664px;
        height: 1390px;
        border-radius: 96px;
        background: #0c0e13;
        box-shadow:
          0 0 0 3px #2b303b,
          0 60px 140px rgba(0, 0, 0, 0.55),
          0 16px 40px rgba(0, 0, 0, 0.3);
        transform-origin: 50% 50%;
        transition-property: transform;
        transition-timing-function: cubic-bezier(0.45, 0, 0.2, 1);
        transition-duration: 0s;
      }
      .phone::before,
      .phone::after {
        content: "";
        position: absolute;
        width: 6px;
        background: #2b303b;
        border-radius: 3px;
      }
      .phone::before {
        left: -9px;
        top: 250px;
        height: 110px;
      }
      .phone::after {
        right: -9px;
        top: 330px;
        height: 170px;
      }
      .scr {
        position: absolute;
        left: 20px;
        top: 20px;
        width: 390px;
        height: 844px;
        transform: scale(1.6);
        transform-origin: 0 0;
        overflow: hidden;
        background: #fff;
        border-radius: 46px;
        color: var(--ink);
      }
      .isl {
        position: absolute;
        left: 50%;
        top: 11px;
        width: 104px;
        height: 28px;
        margin-left: -52px;
        border-radius: 14px;
        background: #000;
        z-index: 40;
      }
      .sbar {
        position: absolute;
        left: 0;
        top: 0;
        width: 390px;
        height: 44px;
        z-index: 30;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 32px 0 36px;
        font-size: 14px;
        font-weight: 600;
        color: #fff;
      }
      .sbar.d {
        color: #202124;
      }
      .sbar .r {
        display: flex;
        gap: 6px;
        align-items: center;
      }

      /* curseur tactile simulé */
      .cur {
        position: absolute;
        left: 0;
        top: 0;
        width: 44px;
        height: 44px;
        opacity: 0;
        z-index: 60;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .cur i {
        display: block;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: rgba(26, 34, 54, 0.28);
        border: 3px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      }
      .rip {
        position: absolute;
        width: 24px;
        height: 24px;
        margin: -12px 0 0 -12px;
        border-radius: 50%;
        border: 4px solid rgba(47, 123, 255, 0.85);
        z-index: 59;
        pointer-events: none;
        animation: rip 0.65s ease-out forwards;
      }
      @keyframes rip {
        from {
          transform: scale(0.6);
          opacity: 1;
        }
        to {
          transform: scale(4.2);
          opacity: 0;
        }
      }

      /* bandeau sombre (substitut stylisé de la photo) */
      .ban {
        position: absolute;
        left: 0;
        top: 0;
        width: 390px;
        overflow: hidden;
        background: linear-gradient(
          160deg,
          #1a2033 0%,
          #0b0f1c 62%,
          #090c17 100%
        );
        border-radius: 0 0 30px 30px;
        z-index: 2;
      }
      .ban .fing {
        position: absolute;
        left: 200px;
        top: -70px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(
          circle,
          #66403a 0,
          #2c1d20 45%,
          transparent 70%
        );
        filter: blur(10px);
        opacity: 0.8;
      }
      .ban .ph3 {
        position: absolute;
        left: 20px;
        top: 80px;
        width: 350px;
        height: 150px;
        border-radius: 22px;
        background: linear-gradient(
          120deg,
          #8f9cb9 0%,
          #cad2e3 35%,
          #7e8eaf 70%
        );
        opacity: 0.35;
        transform: perspective(500px) rotateX(58deg) rotateZ(-20deg);
        filter: blur(2px);
      }
      .ban .shade {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          180deg,
          rgba(9, 12, 22, 0.3),
          rgba(9, 12, 22, 0.8)
        );
      }
      .bub {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(150, 155, 172, 0.55);
        color: #e9edf6;
        border-radius: 9px;
        padding: 5px 12px 5px 5px;
        font-size: 16px;
        font-weight: 500;
        animation: fl 6s ease-in-out infinite;
      }
      .bub::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -7px;
        margin-left: -7px;
        border: 7px solid transparent;
        border-top-color: rgba(150, 155, 172, 0.55);
        border-bottom: 0;
      }
      .bub .ic {
        width: 25px;
        height: 25px;
        border-radius: 50%;
        background: #3d7cf0;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        flex: none;
      }
      .bub .ic svg {
        width: 15px;
        height: 15px;
      }
      @keyframes fl {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-5px);
        }
      }
      .rl {
        position: absolute;
        left: 22px;
        right: 22px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.18em;
        color: #b9bfcd;
        line-height: 1.5;
      }
      .rp {
        position: absolute;
        left: 22px;
        right: 22px;
        font-size: 13px;
        line-height: 1.5;
        color: #fff;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      }
      .moon {
        position: absolute;
        right: 16px;
        top: 52px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--moon);
        display: grid;
        place-items: center;
        color: #fff;
        z-index: 12;
      }

      /* contenu */
      .pg {
        position: absolute;
        left: 22px;
        right: 22px;
      }
      .back {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        color: #2b3447;
      }
      h1 {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: -0.5px;
        line-height: 1.1;
        margin-top: 12px;
        color: var(--ink);
      }
      h2 {
        font-size: 24px;
        font-weight: 600;
        letter-spacing: -0.2px;
        line-height: 1.2;
        margin-top: 18px;
        color: var(--ink);
      }
      .sub {
        font-size: 14px;
        line-height: 1.45;
        color: #4d5666;
        margin-top: 6px;
      }
      .soc {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }
      .soc div {
        flex: 1;
        height: 42px;
        border-radius: 10px;
        background: #f1f3f6;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-size: 13px;
        color: #27303f;
      }
      .or {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-top: 12px;
        color: #8b94a5;
        font-size: 13px;
      }
      .or i {
        flex: 1;
        height: 1px;
        background: #dfe3ea;
        display: block;
      }
      .fld {
        margin-top: 12px;
      }
      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #1f2738;
        margin-bottom: 6px;
      }
      label b {
        color: #e5484d;
        font-weight: 500;
      }
      label small {
        color: #8b94a5;
        font-weight: 400;
        font-size: 11px;
      }
      .two {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .in {
        position: relative;
        height: 42px;
        border: 1px solid #d6dbe5;
        border-radius: 10px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        font-size: 13px;
        color: var(--ink);
        background: #fff;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        overflow: hidden;
      }
      .in.f {
        border-color: #7fa9ff;
        box-shadow: 0 0 0 3px rgba(47, 123, 255, 0.18);
      }
      .in .ph {
        color: #9aa3b2;
        white-space: nowrap;
      }
      .in .val {
        filter: blur(4px);
        white-space: nowrap;
      }
      .in.pw .val {
        font-size: 15px;
        letter-spacing: 1px;
      }
      .in .eye {
        position: absolute;
        right: 13px;
        top: 50%;
        margin-top: -8px;
        color: #4b5563;
      }
      .in.tel {
        padding: 0;
      }
      .in.tel .fl {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 11px;
        height: 100%;
        border-right: 1px solid #d6dbe5;
        color: #4b5563;
      }
      .in.tel .pre {
        padding: 0 4px 0 4px;
        margin-left: 3px;
        color: var(--ink);
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 12px;
        font-size: 13px;
      }
      .rem {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .chk {
        width: 20px;
        height: 20px;
        border: 1px solid #cfd5df;
        border-radius: 6px;
        display: grid;
        place-items: center;
        color: #fff;
        background: #fff;
        transition:
          background 0.15s,
          border-color 0.15s;
        flex: none;
      }
      .chk svg {
        opacity: 0;
      }
      .chk.on {
        background: var(--blue);
        border-color: var(--blue);
      }
      .chk.on svg {
        opacity: 1;
      }
      a,
      .lk {
        color: var(--blue);
        text-decoration: none;
      }
      .btn {
        height: 44px;
        border-radius: 10px;
        background: var(--blue);
        color: #fff;
        font-weight: 500;
        font-size: 14px;
        display: grid;
        place-items: center;
        margin-top: 14px;
        transition:
          transform 0.12s,
          filter 0.12s;
      }
      .btn.press {
        transform: scale(0.97);
        filter: brightness(0.9);
      }
      .foot {
        margin-top: 12px;
        font-size: 13px;
        color: #27303f;
      }
      .terms {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        margin-top: 14px;
        font-size: 12px;
        line-height: 1.5;
        color: #4d5666;
      }
      .terms b {
        font-weight: 500;
        color: var(--ink);
      }
      .terms .chk {
        margin-top: 1px;
      }
      .str {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
        margin-top: 8px;
      }
      .str i {
        height: 5px;
        border-radius: 3px;
        background: #e5e8ee;
        display: block;
        transition: background 0.2s;
      }
      .str i.on {
        background: #16c35c;
      }
      .strl {
        font-size: 11.5px;
        color: #16c35c;
        margin-top: 6px;
        opacity: 0;
        transition: opacity 0.25s;
      }

      /* Gmail mobile (reproduction) */
      .gmv {
        position: absolute;
        inset: 0;
        background: #fff;
        font-family: "Google Sans", Roboto, Arial, Helvetica, sans-serif;
        color: #202124;
      }
      .gmv .ab {
        position: absolute;
        left: 0;
        right: 0;
        top: 44px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        color: #444746;
      }
      .gmv .ab .rr {
        display: flex;
        gap: 22px;
      }
      .gmv .in1 {
        position: absolute;
        left: 18px;
        right: 18px;
        top: 108px;
      }
      .gmv .sbj {
        font-size: 21px;
        line-height: 28px;
        color: #1f1f1f;
      }
      .gmv .bds {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .gmv .bd {
        font-size: 12px;
        line-height: 20px;
        border-radius: 6px;
        padding: 0 8px;
      }
      .gmv .snd {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 22px;
      }
      .gmv .av {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: #8ab4f8;
        overflow: hidden;
        flex: none;
      }
      .gmv .nm {
        font-size: 14.5px;
        font-weight: 500;
        line-height: 20px;
      }
      .gmv .to {
        font-size: 12.5px;
        line-height: 18px;
        color: #5f6368;
      }
      .gmv .sr {
        margin-left: auto;
        color: #444746;
      }
      .gmv .bdy {
        margin-top: 22px;
        font-size: 14.5px;
        line-height: 22px;
        color: #202124;
      }
      .gmv .bdy p {
        margin-bottom: 16px;
      }
      .gmv .lnk {
        display: block;
        color: #1155cc;
        text-decoration: underline;
        word-break: break-all;
        padding: 3px 4px;
        margin: -3px -4px 16px;
        border-radius: 4px;
      }
      .gmv .lnk.press {
        background: rgba(17, 85, 204, 0.16);
        color: #0b3d91;
      }
      .gmv .lnk .bl {
        filter: blur(4px);
        display: inline;
      }

      /* légende */
      #cap {
        position: absolute;
        left: 50%;
        bottom: 250px;
        transform: translateX(-50%);
        background: rgba(8, 12, 26, 0.9);
        color: #fff;
        font-size: 34px;
        font-weight: 500;
        padding: 14px 34px;
        border-radius: 999px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.2s;
        z-index: 20;
        line-height: 1.3;
      }

      /* écran d'attente */
      #ov {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(5, 8, 18, 0.94);
        color: #fff;
        text-align: center;
      }
      #ov .bx {
        max-width: 640px;
        padding: 0 24px;
      }
      #ov h2 {
        font-size: 38px;
        margin: 0 0 10px;
        color: #fff;
      }
      #ov p {
        color: #b8c0d9;
        font-size: 17px;
        line-height: 1.6;
        margin-top: 10px;
      }
      #ov button {
        margin-top: 28px;
        font: inherit;
        font-size: 20px;
        font-weight: 600;
        padding: 14px 46px;
        border: 0;
        border-radius: 12px;
        background: #2f7bff;
        color: #fff;
        cursor: pointer;
      }
      #ov kbd {
        background: #1c2540;
        border-radius: 6px;
        padding: 2px 8px;
        font: inherit;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div id="fit">
      <div id="stage"><div id="cap"></div></div>
    </div>
    <div id="ov">
      <div class="bx">
        <h2>Rifline – Authentification</h2>
        <p>
          Maquette animée mobile 9:16 (1080×1920). Durée : <b id="dur">–</b>.
        </p>
        <p>
          Lancez d'abord l'enregistrement (OBS, capture d'écran de l'OS), puis
          cliquez sur « Lancer ». Coupez 1 à 2 s au début au montage.
        </p>
        <button id="go">Lancer</button>
        <p style="margin-top: 22px">
          <kbd>Espace</kbd> pause · <kbd>R</kbd> recommencer ·
          <kbd>F</kbd> plein écran · <kbd>Échap</kbd> quitter
        </p>
      </div>
    </div>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const stage = $("#stage"),
        cap = $("#cap");
      const PW = 664,
        PH = 1390,
        PCX = 540,
        PCY = 895; // téléphone : taille et centre dans la scène

      /* ---------- icônes ---------- */
      const S = (p, s = 18, w = 2) =>
        `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
      const P = {
        left: '<path d="m15 18-6-6 6-6"/>',
        down: '<path d="m6 9 6 6 6-6"/>',
        check: '<path d="M20 6 9 17l-5-5"/>',
        eye: '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><path d="M2 2l20 20"/>',
        moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
        arrL: '<path d="M19 12H5M12 19l-7-7 7-7"/>',
        archive:
          '<rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/>',
        trash: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5M14 11v5"/>',
        mail: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="m3 8 9 6 9-6"/>',
        more: '<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
        reply: '<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 6 6v3"/>',

              T = s.t0 + t;
            if (k === "cap") cues.push([T, () => say(a[0])]);
            else if (k === "zoom") {
              const p = tpos(el, a[0], 0.5, 0.5),
                fx = p.x / PW,
                fy = p.y / PH;
              cues.push([T, () => zoomTo(ph, fx, fy, a[1], 1.4)]);
            } else if (k === "end")
              cues.push([
                T,
                () => {
                  hideCap();
                  zoomTo(ph, 0.5, 0.5, 1, 0.9);
                  clearFocus(el);
                },
              ]);
            else if (k === "mv") {
              const [d, sel, fx, fy] = a,
                p = tpos(el, sel, fx, fy),
                l = s.kf[s.kf.length - 1];
              s.kf.push({ t: T, x: l.x, y: l.y }, { t: T + d, x: p.x, y: p.y });
              s.hasMv = true;
            } else if (k === "click") {
              const [sel, mode] = a,
                p = curAt(s, T),
                tg = el.querySelector(sel);
              cues.push([
                T,
                () => {
                  ripple(ph, p.x, p.y);
                  if (mode === "chk") tg.classList.toggle("on");
                  else {
                    clearFocus(el);
                    tg.classList.add(mode === "press" ? "press" : "f");
                  }
                },
              ]);
              if (mode === "press")
                cues.push([T + 0.25, () => tg.classList.remove("press")]);
            } else if (k === "type") {
              const [d, sel, txt, mask, str] = a,
                box = el.querySelector(sel);
              s.typers.push({
                t: T,
                d,
                txt,
                mask,
                str,
                val: box.querySelector(".val"),
                ph: box.querySelector(".ph"),
                n: -1,
              });
            }
          }
          if (s.hasMv)
            cues.push([
              s.t0 + 0.4,
              () => {
                s.cur.style.opacity = 1;
              },
            ]);
        });
        cues.push([
          SC[0].t0,
          () => {
            intro.classList.remove("vis");
            intro.classList.add("out");
          },
        ]);
        [[0.15], [0.55], [0.95]].forEach(([t], i) =>
          cues.push([t, () => introEls[i].classList.add("on")]),
        );
        cues.sort((a, b) => a[0] - b[0]);
        built = true;
      }

      function reset() {
        hideCap();
        ci = 0;
        [intro, ...SC.map((s) => s.el)].forEach((e) => {
          e.style.transition = "none";
          e.className = "slide" + (e === intro ? " intro vis" : "");
          void e.offsetWidth;
          e.style.transition = "";
        });
        introEls.forEach((e) => e.classList.remove("on"));
        SC.forEach((s) => {
          s.ph.style.transitionDuration = "0s";
          s.ph.style.transform = "";
          s.cur.style.opacity = 0;
          s.cur.style.transform = `translate(${s.kf[0].x - 22}px,${s.kf[0].y - 22}px)`;
          s.el.querySelectorAll(".in").forEach((e) => e.classList.remove("f"));
          s.el
            .querySelectorAll(".chk")
            .forEach((e) => e.classList.remove("on"));
          s.el
            .querySelectorAll(".btn,.lnk")
            .forEach((e) => e.classList.remove("press"));
          s.el
            .querySelectorAll(".str i")
            .forEach((e) => e.classList.remove("on"));
          s.el.querySelectorAll(".strl").forEach((e) => (e.style.opacity = 0));
          s.el.querySelectorAll(".rip").forEach((e) => e.remove());
          s.typers.forEach((y) => {
            y.n = -1;
            y.val.textContent = "";
            y.ph.style.display = "";
          });
        });
      }

      function tick() {
        while (ci < cues.length && cues[ci][0] <= now) {
          cues[ci][1]();
          ci++;
        }
        for (const s of SC) {
          if (now < s.t0 - 0.2 || now > s.t0 + s.L + 1.4) continue;
          for (const y of s.typers) {
            let n =
              now < y.t
                ? 0
                : now >= y.t + y.d
                  ? y.txt.length
                  : Math.min(
                      y.txt.length,
                      Math.floor(((now - y.t) / y.d) * y.txt.length) + 1,
                    );
            if (n === y.n) continue;
            y.n = n;
            y.val.textContent = y.mask ? "•".repeat(n) : y.txt.slice(0, n);
            y.ph.style.display = n ? "none" : "";
            if (y.str) {
              const lv = Math.floor((n * 5) / y.txt.length);
              s.el
                .querySelectorAll(".str i")
                .forEach((b, j) => b.classList.toggle("on", j < lv));
              s.el.querySelector(".strl").style.opacity = lv >= 5 ? 1 : 0;
            }
          }
          if (s.hasMv) {
            const p = curAt(s, now);
            s.cur.style.transform = `translate(${p.x - 22}px,${p.y - 22}px)`;
          }
        }
      }

      function frame(ts) {
        if (!running) return;
        const dt = last ? Math.min(0.25, (ts - last) / 1000) : 0;
        last = ts;
        if (!paused) now += dt;
        tick();
        if (now >= END) {
          tick();
          running = false;
          hideCap();
          return;
        }
        requestAnimationFrame(frame);
      }
      function start() {
        if (!built) build();
        reset();
        now = 0;
        paused = false;
        last = 0;
        document.body.classList.add("rec");
        $("#ov").style.display = "none";
        if (!running) {
          running = true;
          requestAnimationFrame(frame);
        } else {
          last = 0;
        }
      }
      function stop() {
        running = false;
        paused = false;
        reset();
        now = 0;
        document.body.classList.remove("rec");
        $("#ov").style.display = "flex";
        if (document.fullscreenElement) document.exitFullscreen();
      }

      /* ---------- mise à l'échelle & raccourcis ---------- */
      function fit() {
        const s = Math.min(innerWidth / 1080, innerHeight / 1920);
        $("#fit").style.transform =
          `translate(${-540 * s}px,${-960 * s}px) scale(${s})`;
      }
      addEventListener("resize", fit);
      fit();

      $("#go").onclick = () => {
        (document.fonts && document.fonts.ready
          ? document.fonts.ready
          : Promise.resolve()
        ).then(() => {
          built = false;
          start();
        });
      };
      addEventListener("keydown", (e) => {
        if (e.code === "Space") {
          e.preventDefault();
          if (running) paused = !paused;
        } else if (e.key === "r" || e.key === "R") {
          if ($("#ov").style.display === "none") {
            built = false;
            start();
          }
        } else if (e.key === "f" || e.key === "F") {
          document.fullscreenElement
            ? document.exitFullscreen()
            : document.documentElement.requestFullscreen();
        } else if (e.key === "Escape") {
          if (!document.fullscreenElement) stop();
        }
      });
    </script>
  </body>
</html>
